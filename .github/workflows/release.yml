name: Release

# Tag a release with `git tag v0.3.0 && git push --tags`.
# Registry publishing only runs when the matching secret exists, so the workflow
# still produces a GitHub release with an attached VSIX without either token.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - name: Package
        working-directory: extension
        run: npm run package

      - name: Attach VSIX to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: extension/*.vsix
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: extension
        run: npx vsce publish --no-dependencies --packagePath decipher-*.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: extension
        run: npx ovsx publish decipher-*.vsix -p "$OVSX_PAT"
